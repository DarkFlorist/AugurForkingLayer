name: Zoltar Release Build
on:
  push:
    tags: ['zoltar-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: zoltar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-zoltar
      - run: bun run build:prod
      - run: bun run compile-contracts && bun run check && bun run test && bun run check:artifacts
      - run: bun run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: zoltar-${{ github.ref_name }}
          path: zoltar/ui/zoltar/dist
          if-no-files-found: error

name: Setup Zoltar
description: Install the pinned Zoltar workspace
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.4.2'
    - shell: bash
      working-directory: zoltar
      run: bun install --frozen-lockfile
